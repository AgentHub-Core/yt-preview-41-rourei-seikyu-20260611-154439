<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台本プレビュー 41 老齢年金請求書5年時効</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #121417;
    }
    body {
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.25;
      margin: 0 0 16px;
    }
    .status {
      display: inline-block;
      background: #111;
      color: #fff;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 800;
      padding: 10px 16px;
      margin: 0 0 18px;
    }
    .panel {
      background: #fff;
      border: 4px solid #111;
      padding: 20px;
      margin-top: 18px;
    }
    .hook {
      font-size: clamp(24px, 4vw, 44px);
      line-height: 1.25;
      font-weight: 900;
      margin: 0 0 14px;
    }
    .note {
      font-size: clamp(18px, 2.5vw, 26px);
      line-height: 1.65;
      margin: 0;
    }
    .script-link {
      display: inline-block;
      margin-top: 22px;
      background: #ffd21f;
      color: #111;
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 900;
      padding: 12px 18px;
      text-decoration: none;
      border: 3px solid #111;
    }
    .meta {
      font-size: clamp(15px, 2vw, 20px);
      color: #434a53;
      margin-top: 16px;
      line-height: 1.5;
    }
    ul {
      font-size: clamp(18px, 2.4vw, 24px);
      line-height: 1.6;
      padding-left: 1.4em;
    }
  </style>
</head>
<body>
  <main>
    <p class="status">台本確認用</p>
    <h1>41 老齢年金請求書5年時効</h1>
    <section class="panel">
      <p class="hook">「65歳なら自動で入る」と思っていた。</p>
      <p class="note">
        40番の作り直し版を参考に、0秒で年金相談窓口のクライマックスから始める約6分台本です。
        画像、音声、MP4はまだ作っていません。
      </p>
      <a class="script-link" href="script.md">台本を読む</a>
    </section>
    <section class="panel">
      <h2>確認ポイント</h2>
      <ul>
        <li>冒頭15秒以内に「自動ではない」「5年時効」が伝わるか</li>
        <li>「5年で全部消える」と誤解させない表現になっているか</li>
        <li>繰下げ受給と封筒放置を混同させていないか</li>
        <li>最後に「封筒を開ける」「記録を見る」「予約する」行動へ落ちるか</li>
      </ul>
    </section>
    <p class="meta">
      現在の状態: 台本 v1 / 動画未生成 / 画像未生成<br>
      更新日: 2026-06-11
    </p>
  </main>
</body>
</html>
